app = "mexc-scanner"
primary_region = "jnb" # Johannesburg, closest to you

[build]

[env]
  PORT = "10000"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = false # CRITICAL: Prevents the app from sleeping
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
